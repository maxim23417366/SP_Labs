# Збірка прошивки і хостові тести на кожен pull request (вимога 4.6 ЛР2).
# Використовуються ті самі цілі кореневого Makefile і той самий Docker-образ,
# що й локально, тому результат CI збігається з make на комп'ютері учасника.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependency rule (Devices/ without HAL)
        run: make check-deps

      - name: Firmware build (Docker, arm-none-eabi-gcc)
        run: make build

      - name: Single firmware check - no RTOS, strong modules, git hash (I10)
        run: make fw-check REQUIRE_GIT=1

      # I11: periph_check, усі Unity-набори з покриттям (поріг 90 %), self_test,
      # кадр C -> UART-лог -> Python -> PNG (I08), Python-тести scripts/ і tools/.
      # Один лог з підсумком — артефакт I11_host_checks (Actions -> цей запуск -> Artifacts).
      - name: Host checks - tests, coverage, tools, python (I11)
        run: make host-checks

      - name: Upload host checks log (I11)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: I11_host_checks
          path: tests/build/I11_host_checks.log
          if-no-files-found: error
